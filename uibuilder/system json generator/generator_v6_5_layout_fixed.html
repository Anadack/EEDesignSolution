input,select,textarea{width:100%;background:var(--panel3);color:var(--text);border:1px solid var(--border);border-radius:9px;padding:8px}textarea{resize:vertical;min-height:70px}label{display:block;color:var(--muted);font-size:12px;margin:8px 0 4px}.app{height:100%;display:grid;grid-template-rows:58px 1fr var(--bottom)}

.workspace{display:grid;grid-template-rows:auto 1fr;gap:9px;min-height:0}.breadcrumb{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.crumb{border:1px solid var(--border);background:var(--panel2);border-radius:999px;padding:6px 9px}.crumb.active{border-color:#38bdf8;background:#17324c}.composer{min-height:0;display:grid;grid-template-columns:290px minmax(380px,1fr);gap:10px}.levels{display:grid;grid-template-rows:repeat(4,minmax(110px,1fr));gap:8px;min-height:0}.level{min-height:0;display:flex;flex-direction:column}.level-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}.level-head b{font-size:13px}.level-list{flex:1;min-height:0;overflow:auto;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:7px}.editor{min-height:0;display:flex;flex-direction:column}.editor-body{min-height:0;overflow:auto}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:10px}.card h3{margin:0 0 8px;font-size:13px}.mini{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px dashed var(--border);border-radius:10px;background:#07111f;padding:7px;margin:5px 0}.json-tabs{display:flex;gap:6px;margin-bottom:8px}.tab{border:1px solid var(--border);background:var(--panel2);border-radius:999px;padding:6px 9px;cursor:pointer}.tab.active{background:#17324c;border-color:#38bdf8}.json-area{font-family:Consolas,monospace;background:#020617;color:#dbeafe;border:1px solid #1e293b;border-radius:12px;padding:10px;white-space:pre;overflow:auto;flex:1;min-height:0}.json-edit{font-family:Consolas,monospace;min-height:160px}.terminal{background:#020617;border-top:1px solid var(--border);display:grid;grid-template-rows:8px 32px 1fr}.term-resize{cursor:ns-resize;border-bottom:1px solid var(--border)}.term-head{display:flex;align-items:center; .lib-meta{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);border-radius:999px;background:var(--chip);font-size:11px;padding:3px 7px;color:#cbd5e1}.tree{overflow:auto;min-height:0;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:7px}.tree .item{min-height:30px}.tree .twisty{width:16px;text-align:center;color:#93c5fd;flex:0 0 auto}.tree .folder-name{font-weight:600;color:#dbeafe}.tree .object-name{color:#e5e7eb}.tree .path-hint{color:var(--muted);font-size:11px;margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}.composer{grid-template-columns:minmax(300px,38%) minmax(0,1fr)!important;gap:14px!important;overflow:hidden}.levels,.editor{min-width:0!important;max-width:100%;overflow:hidden}.levels{overflow:auto;padding-right:2px}.level-list{overflow:auto;max-width:100%}.level-list .item{max-width:100%;overflow:hidden}.editor{border-left:1px solid var(--border);padding-left:12px}.editor-body{overflow:auto;min-width:0;max-width:100%;contain:layout paint}.card,.focus-card,.dep-card{max-width:100%;overflow:hidden}.grid3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))!important}.editor-headline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}.editor-headline h3{margin:0;font-size:18px}.editor-subtitle{color:var(--muted);margin-top:3px}.focus-card{background:linear-gradient(180deg,#102033,#0b1220);border:1px solid #1e3a5f;border-radius:14px;padding:12px;margin-bottom:10px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 6px}.section-title h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin:0;color:#cbd5e1}.dependency-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}.dep-card{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:9px}.dep-title{display:flex;align-items:center;gap:6px;justify-content:space-between}.dep-title b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mini-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.quick-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.editor-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,.8fr);gap:10px;min-width:0}.summary-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.kpi{background:#0b1220;border:1px solid var(--border);border-radius:10px;padding:7px;text-align:center}.kpi b{display:block;font-size:16px}.kpi span{font-size:11px;color:var(--muted)}.field-wrap{min-width:0}.proposal{font-size:11px;color:#93c5fd;margin-top:3px;display:flex;justify-content:space-between;gap:6px}.proposal button{font-size:10px;padding:2px 5px;border-radius:7px}.danger-link{background:#451a1a!important;border-color:#7f1d1d!important}.select-inline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:end;margin:4px 0}.item-actions{margin-left:auto;display:flex;gap:4px}.item-actions button{font-size:10px;padding:2px 5px}.card-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.brand-select{min-height:82px}.warnlog,.warn{color:#fde68a}@media(max-width:1100px){.composer{grid-template-columns:1fr!important;grid-template-rows:minmax(260px,42vh) minmax(360px,1fr)!important}.editor{border-left:0;border-top:1px solid var(--border);padding-left:0;padding-top:10px}.levels{max-height:42vh}.editor-split{grid-template-columns:1fr}.summary-kpis{grid-template-columns:repeat(2,1fr)}}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="title">EE Composer Generator v6.5</div>
    <button class="success" onclick="newSystem()">+ System</button>
    <button class="primary" onclick="byId('importJson').click()">Import JSON</button>
    <button class="lib" onclick="byId('importLibrary').click()">Import Library</button>
    <button class="warn" onclick="validateModel(true)">Validate</button>
    <button onclick="runButtonAudit()">Button audit</button>
    <button class="success" onclick="exportCJson()">Export C JSON</button>
    <button onclick="downloadSelected()">Export Selected</button>
    <span class="spacer"></span>
    <span id="modelStatus" class="status bad">INVALID</span>
    <input id="importJson" class="file-input" type="file" accept=".json,application/json" multiple onchange="importJsonFiles(event)">
    <input id="importLibrary" class="file-input" type="file" accept=".json,application/json" multiple webkitdirectory onchange="importLibraryFiles(event)">
  </header>
  <main class="main">
    <aside class="panel left">
      <div class="panel-title"><h2>Library</h2><button class="small" onclick="renderAll()">Refresh</button></div>
      <input id="libraryFilter" placeholder="Filter library tree..." oninput="renderLibrary()">
      <div id="libraryChips" class="lib-meta"></div>
      <div class="toolbar" style="margin:8px 0">
        <button class="lib small" onclick="addLibraryToCurrent()">Add to selected parent</button>
        <button class="small" onclick="openLibrarySystem()">Open system</button>
      </div>
      <div id="libraryView" class="tree"></div>
    </aside>
    <div class="resizer" id="resizeLeft"></div>
    <section class="panel">
      <div class="workspace">
        <div class="breadcrumb">
          <span id="crumbSystem" class="crumb">System</span><span>→</span><span id="crumbComponent" class="crumb">Component</span><span>→</span><span id="crumbDevice" class="crumb">Sensor/Actuator</span><span>→</span><span id="crumbIo" class="crumb">Pin/Connector/Signal</span>
          <span class="spacer"></span><span id="pathText" class="muted"></span>
        </div>
        <div class="composer">
          <div class="levels">
            <div class="level"><div class="level-head"><b>1. Systems</b><button class="success small" onclick="newSystem()">+</button></div><div id="systemsList" class="level-list"></div></div>
            <div class="level"><div class="level-head"><b>2. Components</b><span class="toolbar"><button class="success small" onclick="newComponent()">+</button><button class="lib small" onclick="addLibraryType('component')">lib</button></span></div><div id="componentsList" class="level-list"></div></div>
            <div class="level"><div class="level-head"><b>3. Sensors / Actuators</b><span class="toolbar"><button class="success small" onclick="newDevice('SENSOR')">+S</button><button class="success small" onclick="newDevice('ACTUATOR')">+A</button></span></div><div id="devicesList" class="level-list"></div></div>
            <div class="level"><div class="level-head"><b>4. Pin / Connector / Signal</b><span class="toolbar"><button class="success small" onclick="newIo('pin')">+P</button><button class="success small" onclick="newIo('connector')">+C</button><button class="success small" onclick="newIo('signal')">+S</button></span></div><div id="ioList" class="level-list"></div></div>
          </div>
          <div class="editor">
            <div class="panel-title"><h2 id="editorTitle">Editor</h2><div class="toolbar"><button class="danger small" onclick="deleteSelected()">Delete</button><button class="primary small" onclick="applyJsonToSelected()">Apply JSON</button></div></div>
            <div id="editorBody" class="editor-body"></div>
          </div>
        </div>
      </div>
    </section>
    <div class="resizer" id="resizeRight"></div>
    <aside class="panel right">
      <div class="panel-title"><h2>JSON</h2><div class="toolbar"><button class="small" onclick="copyJson()">Copy</button><button class="small" onclick="downloadJsonView()">Download</button></div></div>
      <div class="json-tabs"><span id="tabObject" class="tab active" onclick="setJsonTab('object')">Object JSON</span><span id="tabC" class="tab" onclick="setJsonTab('c')">C Import JSON</span><span id="tabRaw" class="tab" onclick="setJsonTab('raw')">Raw edit</span></div>
      <pre id="jsonView" class="json-area"></pre>
      <textarea id="jsonEdit" class="json-edit hidden" spellcheck="false"></textarea>
    </aside>
  </main>
  <section class="terminal">
    <div id="resizeBottom" class="term-resize"></div>
    <div class="term-head"><b>Terminal</b><div class="toolbar"><span id="problemCount" class="pill">0 problems</span><button class="small" onclick="clearLogs()">Clear</button></div></div>
    <div id="terminal" class="term-body"></div>
  </section>
</div>
<script>
'use strict';
const ENUMS={priority:['LOW','MEDIUM','HIGH','CRITICAL'],safety:['QM','ASIL_A','ASIL_B','ASIL_C','ASIL_D'],system_level:['SL0','SL1','SL2','SL3'],pin_role:['INPUT','OUTPUT','SUPPLY','GROUND','COMMUNICATION'],iface:['ANALOG','DIGITAL','PWM','CAN','LIN','SENT','ETHERNET','FREQUENCY','RESISTANCE','CURRENT','FLEXRAY','POWER'],unit:['NONE','VOLT','AMPERE','PERCENT','BAR','RPM','DEGREE_C','HZ','OHM','BOOLEAN','COUNT','MM','DEGREE'],digital:['UNSPECIFIED','PULLUP','PULLDOWN','FLOATING','PUSH_PULL','OPEN_DRAIN'],family:['DEUTSCH','AMPSEAL','M12','SUPERSEAL','CUSTOM','UNKNOWN'],gender:['MALE','FEMALE','INLINE','UNKNOWN'],ground:['NONE','LOGIC','POWER','CHASSIS','SENSOR'],reset:['OFF','ON','HIGH_Z','LAST_STATE','UNKNOWN'],supply:['NONE','OUT_SUP_ANA_5V_01','OUT_SUP_ANA_10V_01','VBAT','VREF','CUSTOM'],sensorGround:['NONE','OUT_SUP_ANA_5V_01_GND','OUT_SUP_ANA_10V_01_GND','POWER_GND','LOGIC_GND','CUSTOM'],locations:['CHASSIS','CABIN','CAB','FRONT','REAR','TRAILER','ROOF','ENGINE_BAY','UNDER_HOOD','HYDRAULIC_BLOCK','AXLE','LEFT_SIDE','RIGHT_SIDE','INTERIOR','EXTERIOR','IMPLEMENT','ISOBUS','PTO','BATTERY_BOX','DASHBOARD','SEAT_BASE','FENDER','WHEEL_ARCH','CUSTOM'],brands:['MF','FT','VT']};
function field(key,label,type='text',flag='',values=[]){return{key,label,type,flag,values}}
function deviceFields(kind){return[field('name','Name','text','req'),field('device_type','Device type','enum','req',[kind]),field('part_number','Part number'),field('supplier_pn','Supplier PN'),field('priority','Priority','enum','req',ENUMS.priority),field('safety','Safety','enum','req',ENUMS.safety),field('manufacturer','Manufacturer'),field('description','Description','textarea'),field('notes','Notes','textarea'),field('owner_system','Owner system'),field('owner_architecture','Owner architecture')]}
const SCHEMA={system:[field('type','Type'),field('name','Name','text','req'),field('version','Version'),field('system_level','System level','enum','req',ENUMS.system_level),field('priority','Priority','enum','req',ENUMS.priority),field('safety','Safety','enum','req',ENUMS.safety),field('part_number','Part number'),field('location','Location','enum','',ENUMS.locations),field('take_rate','Take rate','number'),field('is_mandatory','Mandatory','bool'),field('platforms','Platforms','csv'),field('brands','Brands','brands','',ENUMS.brands),field('description','Description','textarea'),field('manufacturer','Manufacturer'),field('notes','Notes','textarea')],component:[field('type','Type'),field('name','Name','text','req'),field('part_number','Part number'),field('supplier_pn','Supplier PN'),field('priority','Priority','enum','req',ENUMS.priority),field('safety','Safety','enum','req',ENUMS.safety),field('manufacturer','Manufacturer'),field('description','Description','textarea'),field('notes','Notes','textarea')],sensor:deviceFields('SENSOR'),actuator:deviceFields('ACTUATOR'),connector:[field('name','Name','text','req'),field('part_number','Part number'),field('family','Family','enum','req',ENUMS.family),field('gender','Gender','enum','req',ENUMS.gender),field('total_cavities','Total cavities','number','req'),field('used_cavities','Used cavities','number','req'),field('max_pin_number','Max pin number','number','req'),field('sealed','Sealed','bool'),field('color','Color'),field('mounting','Mounting'),field('ip_rating','IP rating'),field('rated_voltage','Rated voltage','number'),field('rated_current','Rated current','number'),field('temperature_min','Temperature min','number'),field('temperature_max','Temperature max','number')],pin:[field('number','Number','number','map'),field('name','Name','text','map'),field('role','Role','enum','map',ENUMS.pin_role),field('interface_type','Interface type','enum','map',ENUMS.iface),field('electrical_requirement','Electrical requirement','number','map'),field('signal','Signal','signalRef','map'),field('nominal_current','Nominal current','number','map'),field('inrush_current','Inrush current','number','map'),field('max_voltage','Max voltage','number','map'),field('diagnostics_required','Diagnostics required','number','map'),field('safety_relevant','Safety relevant','bool','map'),field('ground_class','Ground class','enum','map',ENUMS.ground),field('required_reset_state','Required reset state','enum','map',ENUMS.reset),field('required_sensor_supply','Required sensor supply','enum','map',ENUMS.supply),field('required_sensor_ground','Required sensor ground','enum','map',ENUMS.sensorGround),field('required_supply_voltage','Required supply voltage','number','map')],signal:[field('prefix','Prefix','text','map'),field('name','Name'),field('count','Count','number','map'),field('type','Type','text','map'),field('interface','Interface','enum','map',ENUMS.iface),field('interface_type','Interface type','enum','map',ENUMS.iface),field('unit','Unit','enum','map',ENUMS.unit),field('min','Min','number','map'),field('max','Max','number','map'),field('resolution','Resolution','number','map'),field('scaling','Scaling','number','map'),field('priority','Priority','enum','map',ENUMS.priority),field('safety','Safety','enum','map',ENUMS.safety),field('part_number','Part number'),field('digital_structure','Digital structure','enum','map',ENUMS.digital),field('electrical_requirement','Electrical requirement','number','map'),field('role','Role','enum','map',ENUMS.pin_role),field('description','Description','textarea'),field('notes','Notes','textarea'),field('is_mapped','Mapped','bool')]};
const state={arch:{name:'EE_Architecture',systems:[]},sel:{type:'none'},library:[],selectedLibraryId:null,libraryExpanded:{'library':true},jsonTab:'object',logs:[],problems:[]};
const byId=id=>document.getElementById(id); const arr=x=>Array.isArray(x)?x:[]; const clone=o=>JSON.parse(JSON.stringify(o||{})); const uid=p=>p+'_'+Math.random().toString(36).slice(2,9); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function log(msg,level='info'){state.logs.push({msg,level,time:new Date().toLocaleTimeString()});renderLogs()} function clearLogs(){state.logs=[];renderLogs()} function nameOf(o){return o?.name||o?.prefix||'(unnamed)'}
function proposedValue(def,o,t){const p={system:{location:'CHASSIS',brands:['MF','FT','VT'],platforms:['AGCO'],take_rate:100,is_mandatory:true},component:{location:'CHASSIS',take_rate:100,is_mandatory:true},sensor:{device_type:'SENSOR'},actuator:{device_type:'ACTUATOR'}};return p[t]?.[def.key]}
function applyProposal(k,v){editField(k,clone(v))}
function cloneWithNewIds(o,type){const c=normalize(o,type||inferType(o));function walk(x){if(x&&typeof x==='object'){if(x.id)x.id=uid(String(x.id).split('_')[0]||'obj');Object.values(x).forEach(v=>Array.isArray(v)?v.forEach(walk):walk(v))}}walk(c);c.name=(c.name||nameOf(c)||'Object')+'_copy';return c}
function libraryItemsOf(type){return state.library.filter(x=>x.type===type)}
function addLibraryById(id){const item=state.library.find(x=>x.id===id);if(!item)return log('Library item not found','err');addLibraryItem(item)}
function duplicateSelected(){const t=currentType(),o=current();if(t==='sensor'||t==='actuator')return duplicateDevice();if(!o)return log('Select an object to duplicate','err');if(t==='component'){const s=getSystem(),c=cloneWithNewIds(o,'component');s.components.push(c);selectComponent(c.id)}else if(t==='system'){const s=cloneWithNewIds(o,'system');state.arch.systems.push(s);selectSystem(s.id)}else if(['pin','connector','signal'].includes(t))duplicateIo(t);log(t+' duplicated','ok')}
function duplicateDevice(){const c=getComponent(),d=getDevice();if(!c||!d)return log('Select a sensor or actuator to duplicate','err');const type=inferType(d),copy=cloneWithNewIds(d,type);(type==='sensor'?c.sensors:c.actuators).push(copy);selectDevice(copy.id);log(type+' duplicated','ok')}
function duplicateIo(kind){const d=getDevice(),o=getIo();if(!d||!o)return log('Select pin, connector or signal','err');const type=kind||state.sel.ioKind,copy=cloneWithNewIds(o,type),key=type==='pin'?'pins':type==='connector'?'connectors':'signals';d[key].push(copy);selectIo(type,copy.id);log(type+' duplicated','ok')}
function runButtonAudit(){const handlers=[...document.querySelectorAll('[onclick]')].map(e=>e.getAttribute('onclick')||''),ignored=new Set(['byId','event','JSON','Number','String','Math','Date','Array','Object','setTimeout','stopPropagation','click']);const miss=[];handlers.forEach(h=>[...h.matchAll(/\b([A-Za-z_]\w*)\s*\(/g)].forEach(m=>{const n=m[1];if(!ignored.has(n)&&typeof window[n]!=='function')miss.push(n)}));const uniq=[...new Set(miss)];log(uniq.length?'Button audit warning: '+uniq.join(', '):'Button audit OK — all handlers found',uniq.length?'warn':'ok');return uniq}

function buildLibraryTree(){const root={kind:'folder',name:'library',path:'library',children:[]},folders={library:root};function folder(parts){let cur=root,path='library';parts.filter(Boolean).forEach(part=>{path+='/'+part;if(!folders[path]){folders[path]={kind:'folder',name:part,path,children:[]};cur.children.push(folders[path])}cur=folders[path]});return cur}state.library.forEach(item=>{const raw=(item.path||item.name||'object.json').replace(/\\/g,'/'),parts=raw.split('/').filter(Boolean),file=parts.pop()||item.name;folder(parts).children.push({kind:'libraryObject',name:item.name||file,file,path:'lib/'+raw,item,objectKind:item.type||'unknown'})});return root}
function renderLibrary(){const el=byId('libraryView'),chips=byId('libraryChips');if(!el)return;const counts={system:0,component:0,sensor:0,actuator:0,connector:0,pin:0,signal:0,unknown:0};state.library.forEach(x=>counts[x.type]=(counts[x.type]||0)+1);if(chips)chips.innerHTML=Object.entries(counts).filter(([k,v])=>v||['system','component','sensor','actuator'].includes(k)).map(([k,v])=>`<span class="chip">${k}: ${v}</span>`).join('');if(!state.library.length){el.innerHTML='<div class="empty">Import a library folder or JSON files.</div>';return}const filter=(byId('libraryFilter').value||'').toLowerCase(),root=buildLibraryTree();el.innerHTML='';function matches(n){if(!filter)return true;const hay=[n.name,n.file,n.path,n.objectKind,n.item?.name,n.item?.path,n.item?.type,JSON.stringify(n.item?.data||{})].filter(Boolean).join(' ').toLowerCase();return hay.includes(filter)||(n.children||[]).some(matches)}function row(n,d=0){if(!matches(n))return;const isFolder=n.kind==='folder',expanded=state.libraryExpanded[n.path]!==false,div=document.createElement('div');div.className='item '+(!isFolder&&state.selectedLibraryId===n.item.id?'active':'');div.style.marginLeft=(d*12)+'px';div.innerHTML=`<span class="twisty">${isFolder?(expanded?'▾':'▸'):''}</span><span class="${isFolder?'folder-name':'object-name'}">${isFolder?'📁':'🗂️'} ${esc(isFolder?n.name:(n.item.name||n.file))}</span>${!isFolder?`<span class="badge">${esc(n.objectKind)}</span><span class="path-hint">${esc(n.item.path||'')}</span>`:''}`;div.onclick=e=>{e.stopPropagation();if(isFolder){state.libraryExpanded[n.path]=!expanded;renderLibrary()}else{state.selectedLibraryId=n.item.id;renderLibrary();log('Library selected: '+(n.item.name||n.file),'info')}};if(!isFolder)div.ondblclick=e=>{e.stopPropagation();addLibraryItem(n.item)};el.appendChild(div);if(isFolder&&expanded)(n.children||[]).forEach(c=>row(c,d+1))}row(root)}

function addLibraryItem(item){const o=cloneWithNewIds(item.data,item.type),t=item.type;if(t==='system'){state.arch.systems.push(o);selectSystem(o.id)}else if(t==='component'){const s=getSystem();if(!s)return log('Select a system first','err');s.components.push(o);selectComponent(o.id)}else if(t==='sensor'||t==='actuator'){const c=getComponent();if(!c)return log('Select a component first','err');(t==='sensor'?c.sensors:c.actuators).push(o);selectDevice(o.id)}else if(['connector','pin','signal'].includes(t)){const d=getDevice();if(!d)return log('Select a sensor or actuator first','err');(t==='connector'?d.connectors:t==='pin'?d.pins:d.signals).push(o);selectIo(t,o.id)}else return log('Unsupported library object type: '+t,'err');log('Added '+t+' from library as a cloned object','ok');renderAll()}
async function importLibraryFiles(ev){const files=[...ev.target.files].filter(f=>f.name.endsWith('.json'));for(const file of files){try{const data=JSON.parse(await file.text()),type=inferType(data,file.webkitRelativePath||file.name);state.library.push({id:uid('lib'),type,name:data.name||data.prefix||file.name,path:file.webkitRelativePath||file.name,data:normalize(data,type)});}catch(e){log('Parse error '+file.name+': '+e.message,'err')}}ev.target.value='';log(files.length+' library file(s) imported','ok');renderAll()}async function importJsonFiles(ev){const files=[...ev.target.files];for(const file of files){try{const data=JSON.parse(await file.text()),type=inferType(data,file.name);if(type==='system'){const s=normalize(data,'system');state.arch.systems.push(s);selectSystem(s.id);log('System imported: '+s.name,'ok')}else{state.library.push({id:uid('lib'),type,name:data.name||data.prefix||file.name,path:file.name,data:normalize(data,type)});log('Object imported into library: '+file.name,'ok')}}catch(e){log('Parse error '+file.name+': '+e.message,'err')}}ev.target.value='';renderAll()}function openLibrarySystem(){const item=state.library.find(x=>x.id===state.selectedLibraryId);if(!item||item.type!=='system')return log('Select a system in library','err');const s=normalize(item.data,'system');state.arch.systems.push(s);selectSystem(s.id);log('System opened from library','ok')}
function cSignal(s){return{prefix:s.prefix||s.name||'Signal',count:Number(s.count||1),type:s.type||s.interface_type||s.interface||'ANALOG',interface:s.interface||s.interface_type||s.type||'ANALOG',unit:s.unit||'NONE',min:s.min??0,max:s.max??0,resolution:s.resolution??1,scaling:s.scaling??1,priority:s.priority||'MEDIUM',safety:s.safety||'QM',part_number:s.part_number||'',digital_structure:s.digital_structure||'UNSPECIFIED',electrical_requirement:Number(s.electrical_requirement||0),role:s.role||'INPUT',description:s.description||'',notes:s.notes||''}}
function cDevice(d,kind,sys){return{name:d.name||kind,device_type:kind,priority:d.priority||'MEDIUM',safety:d.safety||'QM',part_number:d.part_number||'',supplier_pn:d.supplier_pn||'',manufacturer:d.manufacturer||'',description:d.description||'',notes:d.notes||'',owner_system:sys.name,owner_architecture:d.owner_architecture||state.arch.name,signals:arr(d.signals).map(cSignal),pins:arr(d.pins).map(p=>{const x=clone(p);delete x.id;return x}),connectors:arr(d.connectors).map(c=>{const x=clone(c);delete x.id;return x})}}
function cSystem(sys=getSystem()||state.arch.systems[0]){if(!sys)return null;const devices=[];arr(sys.components).forEach(c=>{arr(c.sensors).forEach(d=>devices.push(cDevice(d,'SENSOR',sys)));arr(c.actuators).forEach(d=>devices.push(cDevice(d,'ACTUATOR',sys)))});return{type:'system',name:sys.name,version:sys.version||'1.0',system_level:sys.system_level||'SL1',priority:sys.priority||'MEDIUM',safety:sys.safety||'QM','Ref-2X':sys['Ref-2X']||'',part_number:sys.part_number||'',location:sys.location||'',take_rate:sys.take_rate??100,is_mandatory:sys.is_mandatory??true,platforms:sys.platforms||[],brands:sys.brands||[],description:sys.description||'',manufacturer:sys.manufacturer||'',notes:sys.notes||'',devices}}
function validateModel(verbose=false){const p=[];const req=(ok,msg)=>{if(!ok)p.push(msg)};arr(state.arch.systems).forEach(s=>{req(s.name,'System missing name');req(arr(s.components).length,'System '+s.name+' has no component');arr(s.components).forEach(c=>{req(c.name,'Component missing name');req(arr(c.sensors).length+arr(c.actuators).length,'Component '+c.name+' has no sensor/actuator');[...arr(c.sensors),...arr(c.actuators)].forEach(d=>{req(d.name,'Device missing name');req(arr(d.connectors).length,'Device '+d.name+' has no connector');req(arr(d.pins).length,'Device '+d.name+' has no pin');req(arr(d.signals).length,'Device '+d.name+' has no signal');const sigNames=new Set(arr(d.signals).map(s=>s.prefix||s.name));arr(d.pins).forEach(pin=>{['number','name','role','interface_type','electrical_requirement','signal'].forEach(k=>req(pin[k]!==undefined&&pin[k]!==null&&pin[k]!=='','Pin '+(pin.name||pin.number)+' missing '+k));req(!pin.signal||sigNames.has(pin.signal),'Pin '+(pin.name||pin.number)+' references unknown signal '+pin.signal)})})})});state.problems=p;byId('problemCount').textContent=p.length+' problems';byId('modelStatus').textContent=p.length?'INVALID':'VALID';byId('modelStatus').className='status '+(p.length?'bad':'ok');if(verbose){if(p.length)p.forEach(x=>log(x,'err'));else log('Validation passed','ok')}return p}
function renderJson(){byId('tabObject').classList.toggle('active',state.jsonTab==='object');byId('tabC').classList.toggle('active',state.jsonTab==='c');byId('tabRaw').classList.toggle('active',state.jsonTab==='raw');const obj=state.jsonTab==='c'?cSystem():current();const text=JSON.stringify(obj||{},null,2);byId('jsonView').classList.toggle('hidden',state.jsonTab==='raw');byId('jsonEdit').classList.toggle('hidden',state.jsonTab!=='raw');if(state.jsonTab==='raw')byId('jsonEdit').value=text;else byId('jsonView').textContent=text}function setJsonTab(t){state.jsonTab=t;renderJson()}function applyJsonToSelected(){try{const obj=JSON.parse(byId('jsonEdit').classList.contains('hidden')?byId('jsonView').textContent:byId('jsonEdit').value);const t=currentType();if(t==='system'){Object.assign(getSystem(),normalize(obj,'system'))}else if(t==='component'){Object.assign(getComponent(),normalize(obj,'component'))}else if(t==='sensor'||t==='actuator'){Object.assign(getDevice(),normalize(obj,t))}else if(['pin','connector','signal'].includes(t)){Object.assign(getIo(),normalize(obj,t))}log('JSON applied to selected object','ok');renderAll()}catch(e){log('Cannot apply JSON: '+e.message,'err')}}
function downloadText(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportCJson(){const probs=validateModel(true);if(probs.length)return log('Export blocked: invalid model','err');const sys=cSystem();if(!sys)return log('No system to export','err');downloadText((sys.name||'system')+'_C_import.json',JSON.stringify(sys,null,2));log('C JSON exported','export')}function downloadSelected(){const obj=current();if(!obj)return;downloadText((nameOf(obj)||'object')+'.json',JSON.stringify(obj,null,2))}function downloadJsonView(){downloadText((state.jsonTab==='c'?'C_import':'object')+'.json',state.jsonTab==='raw'?byId('jsonEdit').value:byId('jsonView').textContent)}async function copyJson(){await navigator.clipboard.writeText(state.jsonTab==='raw'?byId('jsonEdit').value:byId('jsonView').textContent);log('JSON copied','info')}
function renderLogs(){const e=byId('terminal');e.innerHTML=state.logs.slice(-300).map(l=>`<div class="${l.level}">[${l.time}] ${esc(l.msg)}</div>`).join('');e.scrollTop=e.scrollHeight}function renderAll(doValidate=true){renderHierarchy();renderEditor();renderLibrary();renderBread();renderJson();if(doValidate)validateModel(false)}
function initResize(){let mode=null,sx=0,sy=0,sl=0,sr=0,sb=0;const css=(k,d)=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue(k))||d;function start(e,m){mode=m;sx=e.clientX;sy=e.clientY;sl=css('--left',340);sr=css('--right',520);sb=css('--bottom',210);document.body.style.userSelect='none'}byId('resizeLeft').onmousedown=e=>start(e,'left');byId('resizeRight').onmousedown=e=>start(e,'right');byId('resizeBottom').onmousedown=e=>start(e,'bottom');window.onmousemove=e=>{if(!mode)return;if(mode==='left')document.documentElement.style.setProperty('--left',Math.max(240,Math.min(720,sl+e.clientX-sx))+'px');if(mode==='right')document.documentElement.style.setProperty('--right',Math.max(340,Math.min(900,sr-(e.clientX-sx)))+'px');if(mode==='bottom')document.documentElement.style.setProperty('--bottom',Math.max(120,Math.min(520,sb-(e.clientY-sy)))+'px')};window.onmouseup=()=>{mode=null;document.body.style.userSelect=''}}
window.addEventListener('DOMContentLoaded',()=>{initResize();newSystem();log('v6.5 ready — layout overlap fixed, locations/brands and library clone actions enabled','ok')});
</script>
