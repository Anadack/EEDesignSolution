function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function render() {
  const d = DATA;
  document.getElementById("hdr-meta").textContent =
    `${d.meta.project} · rev ${d.meta.revision} · ${d.meta.nodeCount} node(s) · from ${d.meta.generatedFrom}`;

  // Legend
  const legend = document.getElementById("legend");
  legend.innerHTML = d.buses.map(b =>
    `<span><span class="sw" style="background:${esc(b.color)}"></span>${esc(b.name)} (${esc(b.protocol)})</span>`
  ).join("");

  // Diagram: ECUs across two rows, buses as horizontal lanes, stubs connecting them.
  const svg = document.getElementById("diagram");
  const W = Math.max(900, (d.nodes.length + 1) * 130);
  svg.setAttribute("viewBox", `0 0 ${W} 420`);
  const topNodes = d.nodes.filter(n => n.row !== "bottom");
  const botNodes = d.nodes.filter(n => n.row === "bottom");
  const nodeX = {};
  const layoutRow = (list, y) => {
    const step = W / (list.length + 1);
    list.forEach((n, i) => { nodeX[n.id] = { x: (i + 1) * step, y }; });
  };
  layoutRow(topNodes, 70);
  layoutRow(botNodes, 350);

  const busY = {};
  d.buses.forEach((b, i) => { busY[b.id] = 140 + i * 40; });

  let svgParts = [];

  // bus lines
  d.buses.forEach(b => {
    const y = busY[b.id];
    svgParts.push(`<line class="bus-line" data-bus="${esc(b.id)}" x1="20" y1="${y}" x2="${W-20}" y2="${y}" stroke="${esc(b.color)}"/>`);
    svgParts.push(`<text class="bus-label" x="24" y="${y-8}" fill="${esc(b.color)}">${esc(b.name)}</text>`);
  });

  // stubs from nodes to their buses
  (d.connections || []).forEach(c => {
    const pos = nodeX[c.nodeId];
    const y = busY[c.busId];
    if (!pos || y === undefined) return;
    const y2 = pos.y > y ? pos.y - 26 : pos.y + 26;
    svgParts.push(`<line class="stub" data-bus="${esc(c.busId)}" x1="${pos.x}" y1="${y2}" x2="${pos.x}" y2="${y}"/>`);
  });

  // node boxes
  d.nodes.forEach(n => {
    const pos = nodeX[n.id];
    if (!pos) return;
    svgParts.push(`<g class="node" data-node="${esc(n.id)}">
      <rect class="node-box" x="${pos.x-48}" y="${pos.y-22}" width="96" height="44"/>
      <text class="node-label" x="${pos.x}" y="${pos.y-2}" text-anchor="middle">${esc(n.shortName || n.name)}</text>
      <text class="node-sub" x="${pos.x}" y="${pos.y+14}" text-anchor="middle">${esc(n.diagnosticAddress || "")}</text>
    </g>`);
  });

  svg.innerHTML = svgParts.join("");

  // bus click -> highlight
  svg.querySelectorAll(".bus-line").forEach(el => {
    el.addEventListener("click", () => {
      const busId = el.getAttribute("data-bus");
      svg.querySelectorAll(".stub").forEach(s => s.classList.toggle("active", s.getAttribute("data-bus") === busId));
      document.getElementById("filter").value = "";
      filterAll("");
      document.querySelectorAll("#msg-table tbody tr").forEach(tr => {
        tr.classList.toggle("hidden", tr.getAttribute("data-bus") !== busId);
      });
    });
  });

  // Bus table
  const busBody = document.querySelector("#bus-table tbody");
  busBody.innerHTML = d.buses.map(b => {
    const nodeCount = (d.connections || []).filter(c => c.busId === b.id).length;
    return `<tr data-name="${esc((b.name+' '+b.protocol).toLowerCase())}">
      <td><span class="sw" style="background:${esc(b.color)};display:inline-block;width:10px;height:10px;border-radius:2px;"></span> ${esc(b.name)}</td>
      <td>${esc(b.protocol)}</td><td>${esc(b.bitrate)}</td><td>${esc(b.addressScheme)}</td>
      <td>${esc(b.physicalLayer)}</td><td>${esc(b.termination)}</td><td>${esc(b.loadTarget)}</td>
      <td>${nodeCount}</td></tr>`;
  }).join("");

  // Message table
  const msgBody = document.querySelector("#msg-table tbody");
  msgBody.innerHTML = (d.messages || []).map(m => `<tr data-bus="${esc(m.busId)}" data-name="${esc((m.name+' '+m.producerNodeId).toLowerCase())}">
      <td>${esc(m.name)}</td><td>${esc(m.busId)}</td><td><code>${esc(m.canId)}</code></td>
      <td>${esc(m.idFormat)}</td><td>${esc(m.dlc)}</td><td>${esc(m.cycleMs)}</td>
      <td>${esc(m.producerNodeId)}</td><td>${esc((m.consumerNodeIds||[]).join(", "))}</td>
      <td>${esc((m.signals||[]).join(", "))}</td></tr>`).join("");
}

function filterAll(q) {
  q = q.trim().toLowerCase();
  document.querySelectorAll("#bus-table tbody tr, #msg-table tbody tr").forEach(tr => {
    const hay = tr.getAttribute("data-name") || "";
    tr.classList.toggle("hidden", q !== "" && !hay.includes(q));
  });
}

document.getElementById("filter").addEventListener("input", e => filterAll(e.target.value));

render();
</script>
