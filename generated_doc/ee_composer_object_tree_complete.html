/* ====================================================================
 *  LAYOUT ENGINE
 * ==================================================================== */
var NW = 170, NH = 52, GX = 32, GY = 44, PAD = 30;
var dpr = window.devicePixelRatio || 1;
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');
var tipEl = document.getElementById('tip');
var byId = {};  MODEL.forEach(function(n){ byId[n.id] = n; });
function kids(pid){ return MODEL.filter(function(n){ return n.p === pid; }); }

function sw(id){
  var ch = kids(id);
  if(!ch.length) return NW;
  var w = 0;
  ch.forEach(function(c,i){ if(i) w += GX; w += sw(c.id); });
  return Math.max(NW, w);
}

var pos = {};
function lay(id, x, y){
  var w = sw(id);
  pos[id] = { x: x + w/2 - NW/2, y: y, w: NW, h: NH };
  var cx = x;
  kids(id).forEach(function(c){ lay(c.id, cx, y + NH + GY); cx += sw(c.id) + GX; });
}
lay('arch', PAD, PAD);
lay('est_result', sw('arch') + PAD + GX * 3, PAD);

var W = 0, H = 0;
Object.keys(pos).forEach(function(k){ var p=pos[k]; W=Math.max(W,p.x+p.w); H=Math.max(H,p.y+p.h); });
W += PAD*2; H += PAD*2;
canvas.width = W * dpr; canvas.height = H * dpr;
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
ctx.scale(dpr, dpr);

/* ====================================================================
 *  DRAW HELPERS
 * ==================================================================== */
function hexRgba(hex, a){
  var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

function drawVein(x1,y1,x2,y2,color,w,dash){
  var my1=y1+(y2-y1)*.35, my2=y1+(y2-y1)*.65;
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=w;
  if(dash) ctx.setLineDash(dash);
  ctx.shadowColor=color; ctx.shadowBlur=8;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.bezierCurveTo(x1,my1, x2,my2, x2,y2);
  ctx.stroke();
  ctx.restore();
}

function drawXref(fp,tp,style){
  var x1=fp.x+fp.w, y1=fp.y+fp.h/2;
  var x2=tp.x, y2=tp.y+tp.h/2;
  var offx=Math.abs(y1-y2)*.3+40;
  ctx.save();
  ctx.lineWidth=1.5;
  if(style==='connect'){ ctx.strokeStyle=hexRgba('#56d364',.45); ctx.setLineDash([3,4]); ctx.shadowColor='#56d364'; }
  else{ ctx.strokeStyle=hexRgba('#f97583',.4); ctx.setLineDash([6,4]); ctx.shadowColor='#f97583'; }
  ctx.shadowBlur=6;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.bezierCurveTo(x1+offx,y1, x2-offx,y2, x2,y2);
  ctx.stroke();
  ctx.restore();
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

/* ====================================================================
 *  RENDER
 * ==================================================================== */
function render(hid){
  ctx.clearRect(0,0,W,H);
  /* bg gradient */
  var bg=ctx.createRadialGradient(W/2,80,50,W/2,H/2,W);
  bg.addColorStop(0,'#161b22'); bg.addColorStop(1,'#0d1117');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

  /* ownership veins */
  MODEL.forEach(function(n){
    if(!n.p) return;
    var pp=pos[n.p], cp=pos[n.id];
    var dim=(hid && hid!==n.id && hid!==n.p)?.15:.55;
    drawVein(pp.x+pp.w/2, pp.y+pp.h, cp.x+cp.w/2, cp.y, hexRgba(byId[n.p].c, dim), 2, null);
  });

  /* xref arcs */
  XREFS.forEach(function(xr){
    var fp=pos[xr.from], tp=pos[xr.to];
    if(fp&&tp) drawXref(fp,tp,xr.style);
  });

  /* nodes */
  MODEL.forEach(function(n){
    var p=pos[n.id];
    var isH=(hid===n.id);
    var dim=(hid && !isH)?.45:1;

    ctx.save();
    if(isH){ ctx.shadowColor=n.c; ctx.shadowBlur=22; }
    else{ ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=6; }

    rr(p.x,p.y,p.w,p.h,8);
    ctx.fillStyle=hexRgba(n.c, .12*dim); ctx.fill();
    ctx.strokeStyle=hexRgba(n.c, .7*dim); ctx.lineWidth=isH?2.5:1.5; ctx.stroke();
    ctx.restore();

    /* title */
    ctx.save();
    ctx.font='bold 12px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle=hexRgba('#ffffff', .95*dim);
    ctx.fillText(n.short, p.x+10, p.y+20);

    ctx.font='10px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle=hexRgba('#8b949e', .8*dim);
    ctx.fillText(n.type, p.x+10, p.y+36);

    /* prop count badge */
    var cnt=n.scalar.length+n.arrays.length+n.refs.length+n.embed.length;
    var badge=cnt+' props';
    var bw=ctx.measureText(badge).width+10;
    rr(p.x+p.w-bw-6, p.y+6, bw, 16, 3);
    ctx.fillStyle=hexRgba(n.c, .25*dim); ctx.fill();
    ctx.fillStyle=hexRgba('#ffffff', .6*dim);
    ctx.font='9px "Segoe UI",system-ui,sans-serif';
    ctx.fillText(badge, p.x+p.w-bw-1, p.y+17);
    ctx.restore();
  });
}
render(null);

/* ====================================================================
 *  INTERACTION
 * ==================================================================== */
function hitTest(mx,my){
  for(var i=0;i<MODEL.length;i++){
    var p=pos[MODEL[i].id];
    if(mx>=p.x && mx<=p.x+p.w && my>=p.y && my<=p.y+p.h) return MODEL[i];
  }
  return null;
}

var curH=null;
canvas.addEventListener('mousemove', function(ev){
  var rect=canvas.getBoundingClientRect();
  var mx=ev.clientX-rect.left, my=ev.clientY-rect.top;
  var hit=hitTest(mx,my);

  if(hit!==curH){ curH=hit; render(hit?hit.id:null); }

  if(hit){
    var html='<h3 style="color:'+hit.c+'">'+hit.type+'</h3>';
    if(hit.scalar.length){
      html+='<div class="section">Scalar Properties</div>';
      hit.scalar.forEach(function(s){ html+='<div class="p scalar">• '+s+'</div>'; });
    }
    if(hit.arrays.length){
      html+='<div class="section">Owned Arrays (Children)</div>';
      hit.arrays.forEach(function(s){ html+='<div class="p arr">⯈ '+s+'</div>'; });
    }
    if(hit.embed.length){
      html+='<div class="section">Embedded / Count Fields</div>';
      hit.embed.forEach(function(s){ html+='<div class="p" style="color:#79c0ff">◉ '+s+'</div>'; });
    }
    if(hit.refs.length){
      html+='<div class="section">Back-References</div>';
      hit.refs.forEach(function(s){ html+='<div class="p ref">⟵ '+s+'</div>'; });
    }
    tipEl.innerHTML=html;
    tipEl.classList.add('show');
    var tx=ev.clientX+16, ty=ev.clientY-10;
    if(tx+420>window.innerWidth) tx=ev.clientX-430;
    if(ty+tipEl.offsetHeight>window.innerHeight) ty=window.innerHeight-tipEl.offsetHeight-10;
    tipEl.style.left=tx+'px'; tipEl.style.top=ty+'px';
  } else {
    tipEl.classList.remove('show');
  }
});

canvas.addEventListener('mouseleave', function(){
  curH=null; render(null); tipEl.classList.remove('show');
});
</script>
</body>
</html>
